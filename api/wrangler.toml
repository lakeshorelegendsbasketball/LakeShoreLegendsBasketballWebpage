name = "lsl-booking-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Coachgiopag@gmail.com's Account — every environment deploys here only.
account_id = "43627e74618576acff8b7a613339f09e"

[[d1_databases]]
binding = "DB"
database_name = "lsl-booking"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

[triggers]
# Expire unpaid checkout holds and send reminders.
crons = ["*/10 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://www.lakeshorelegendsbasketball.com,https://lakeshorelegendsbasketball.com"
API_PUBLIC_URL = ""
# "live" sends to families. Anything else redirects every email to EMAIL_REDIRECT_TO.
EMAIL_MODE = "redirect"
EMAIL_FROM = ""
EMAIL_REDIRECT_TO = ""

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   SETUP_TOKEN            one-time token to create the first director account
#   STRIPE_WEBHOOK_SECRET  whsec_… from the Stripe webhook endpoint
#   STRIPE_SECRET_KEY      optional restricted key (read Payment Links + Prices) for price checks
#   RESEND_API_KEY         optional; enables family emails

# Test server: Stripe TEST mode, emails redirected, its own database.
[env.staging]
name = "lsl-booking-api-staging"
[env.staging.vars]
ALLOWED_ORIGINS = "https://www.lakeshorelegendsbasketball.com,https://lakeshorelegendsbasketball.com,http://localhost:8080"
API_PUBLIC_URL = "https://lsl-booking-api-staging.coachgiopag.workers.dev"
EMAIL_MODE = "redirect"
EMAIL_FROM = ""
EMAIL_REDIRECT_TO = ""
[[env.staging.d1_databases]]
binding = "DB"
database_name = "lsl-booking-staging"
database_id = "5bb76eca-5ac1-4330-93b2-2169e65cfc01"
migrations_dir = "migrations"
[env.staging.triggers]
crons = ["*/10 * * * *"]

[env.dev]
name = "lsl-booking-api-dev"
[env.dev.vars]
ALLOWED_ORIGINS = "http://localhost:8080,http://127.0.0.1:8080"
API_PUBLIC_URL = "http://localhost:8787"
EMAIL_MODE = "redirect"
EMAIL_FROM = ""
EMAIL_REDIRECT_TO = ""
[[env.dev.d1_databases]]
binding = "DB"
database_name = "lsl-booking-dev"
database_id = "local-dev"
migrations_dir = "migrations"
