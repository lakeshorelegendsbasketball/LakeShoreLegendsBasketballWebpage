<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alumni | Lake Shore Legends</title>
<link rel="icon" href="assets/monogram-lsl.png">
<link rel="stylesheet" href="css/colors_and_type.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/extra.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/image-slot.js"></script>
</head>
<body>
<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<rect width="100" height="100" fill="#123053"/>
<circle cx="50" cy="50" r="22" fill="#e35802"/>
<path d="M50 28 v44 M28 50 h44 M34 34 a30 30 0 0 1 32 0 M34 66 a30 30 0 0 0 32 0" stroke="#123053" stroke-width="2.4" fill="none"/>
<text x="50" y="90" text-anchor="middle" fill="#fcf2e8" font-family="Georgia,serif" font-size="11" font-weight="700">LSL</text>
</svg>
</template>
<div id="root"></div>
<script type="text/babel" src="js/shell.jsx"></script>
<script type="text/babel" src="js/alumni.jsx"></script>
<script type="text/babel" data-presets="react">
function App() {
  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, []);
  return (
    <div className="lsl-scroll" data-screen-label="Alumni">
      <Header page="Alumni" />
      <PageHero eyebrow="Alumni Success" accent="orange"
        title="From Our Gym To The Next Level"
        sub="Explore the journeys of former players who excelled on and off the court — built on the foundational skills and values instilled at LakeShore Legends." />
      <ImpactBand />
      <AlumniStories />
      <Offers />
      <CTA title="Start Your Legend Story" sub="Every commitment started with a single training session. Take yours." btn="Get In Touch" />
      <Footer />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
