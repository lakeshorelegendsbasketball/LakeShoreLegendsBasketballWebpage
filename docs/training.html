<!DOCTYPE html>
<html lang="en">
<head>

<link rel="icon" href="assets/monogram-lsl.png">
<link rel="stylesheet" href="css/colors_and_type.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/extra.css">
<script src="js/dist/react.production.min.js"></script>
<script src="js/dist/react-dom.production.min.js"></script>

<body>
<div id="root"></div>
<script src="js/dist/shell.js"></script>
<script src="js/dist/training.js"></script>
<script src="js/dist/booking-store.js"></script>
<script src="js/dist/booking.js"></script>
<script>
(function () {
  var Header = window.Header, PageHero = window.PageHero, Programs = window.Programs;
  var PrivateBooking = window.PrivateBooking, SkillsFocus = window.SkillsFocus;
  var CTA = window.CTA, Footer = window.Footer;

  function App() {
    React.useEffect(function () { if (window.lucide) window.lucide.createIcons(); }, []);
    return React.createElement('div', { className: 'lsl-scroll', 'data-screen-label': 'Training' },
      React.createElement(Header, { page: 'Training' }),
      React.createElement(PageHero, {
        eyebrow: 'Training & Camps',
        title: 'Where Athletes Are Built',
        sub: 'Intentional skill development, structured teaching, and purposeful repetition — at every level. Book a session and reserve your spot in under a minute.'
      }),
      React.createElement(Programs, null),
      React.createElement(PrivateBooking, null),
      React.createElement(SkillsFocus, null),
      React.createElement(CTA, {
        title: "Don't See A Date That Works?",
        sub: 'Reach out about private sessions, custom small-group blocks, or team training.',
        btn: 'Get In Touch'
      }),
      React.createElement(Footer, null)
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
})();
</script>
