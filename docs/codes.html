<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codes of Conduct | Lake Shore Legends</title>
<link rel="icon" href="assets/monogram-lsl.png">
<link rel="stylesheet" href="css/colors_and_type.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/extra.css">
<script src="js/dist/react.production.min.js"></script>
<script src="js/dist/react-dom.production.min.js"></script>
<script src="js/dist/lucide.min.js"></script>
<script src="js/image-slot.js"></script>
</head>
<body>
<div id="root"></div>
<script src="js/dist/shell.js"></script>
<script src="js/dist/codes.js"></script>
<script>
(function () {
  var Header = window.Header, PageHero = window.PageHero, Footer = window.Footer;
  var CodesIntro = window.CodesIntro, OrgStandards = window.OrgStandards;
  var CoachesCode = window.CoachesCode, ParentsCode = window.ParentsCode;
  var CommPolicy = window.CommPolicy, CodesClosing = window.CodesClosing;

  function App() {
    React.useEffect(function () { if (window.lucide) window.lucide.createIcons(); }, []);
    return React.createElement('div', { className: 'lsl-scroll', 'data-screen-label': 'Codes' },
      React.createElement(Header, { page: 'Codes' }),
      React.createElement(PageHero, {
        eyebrow: 'Codes of Conduct',
        title: 'The standards we play by.',
        sub: 'Every athlete, coach, volunteer, parent, and spectator is held to these standards — no exceptions.'
      }),
      React.createElement(CodesIntro, null),
      React.createElement(OrgStandards, null),
      React.createElement(CoachesCode, null),
      React.createElement(ParentsCode, null),
      React.createElement(CommPolicy, null),
      React.createElement(CodesClosing, null),
      React.createElement(Footer, null)
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
})();
</script>
</body>
</html>
